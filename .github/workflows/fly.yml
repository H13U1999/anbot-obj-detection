name: Fly Deploy
on:
  push:
    branches:
      - release
jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - working-directory: ./services/detection/
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # The discord bot (app: discord-ml-bot) was never part of this pipeline,
      # so every push left it running whatever was last deployed by hand.
      - working-directory: ./services/discord-bot/
        run: flyctl deploy --remote-only
        env:
          # FLY_API_TOKEN is app-scoped to the detection app, so it cannot deploy
          # discord-ml-bot. Set FLY_API_TOKEN_BOT to a token for that app, or
          # replace FLY_API_TOKEN with an org-scoped one and this falls back.
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_BOT || secrets.FLY_API_TOKEN }}