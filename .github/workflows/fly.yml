name: Fly Deploy
on:
  push:
    branches:
      - release
jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - working-directory: ./services/detection/
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # The discord bot (app: discord-ml-bot) was never part of this pipeline,
      # so every push left it running whatever was last deployed by hand.
      - working-directory: ./services/discord-bot/
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}