# fly.toml app configuration file generated for discord-ml-bot on 2023-08-30T12:10:10+07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "discord-ml-bot"
primary_region = "sin"

[build]
[env]
DECT_API = "https://an-bot-obj-dect.fly.dev/obj-dect"
NTS_API = "https://an-bot-nts.fly.dev/combine-NTS"
# No [[services]] block: this app holds an outbound WebSocket to Discord and
# listens on nothing, so it exposes no ports. Machine count is controlled with
# `fly scale count 1` instead - and must stay at exactly 1, since two processes
# on one bot token both receive every message and reply twice.
