version: "3.7"

services:
  detection:
    build:  ./services/detection
    restart: always
    ports:
      - "8080:5000"
    volumes:
      # This already mounts every file in the service dir, including app.py.
      # Do not add per-file bind mounts on top of it: if the host path does not
      # exist Docker creates it as a *directory*, then fails to mount it over a
      # file in the image.
      - ./services/detection/:/app
    environment:
      PORT: "5000"
      FLASK_APP: "${FLASK_APP}"
      API_KEY: "${API_KEY}"
      AUTH_DOMAIN: "${AUTH_DOMAIN}"
      PROJECT_ID: "${PROJECT_ID}"
      STORAGE_BUCKET: "${STORAGE_BUCKET}"
      MESSAGING_SENDER_ID: "${MESSAGING_SENDER_ID}"
      APP_ID: "${APP_ID}"
      MEASUREMENT_ID: "${MEASUREMENT_ID}"

  disord-bot:
    build:  ./services/discord-bot
    restart: always
    volumes:
      - ./services/discord-bot/:/app
    environment:
      PREFIX: "${PREFIX}"
      TOKEN: "${TOKEN}"
      DECT_API: "${DECT_API}"
      NTS_API: "${NTS_API}"
